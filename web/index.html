<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#111214">
<title>Kravos Bas</title>
<meta name="description" content="Teorija za bas gitaru, primenjena: vrat, intervali, akordi, tonalitet i improvizacija.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E2019'/%3E%3Crect x='8' y='16' width='3' height='32' fill='%23E9E2D4'/%3E%3Cpath d='M22 16v32M36 16v32M50 16v32' stroke='%23B9B2A8' stroke-width='1.6'/%3E%3Cpath d='M8 21h50M8 29h50M8 37h50M8 45h50' stroke='%23D9D2C6' stroke-width='1.6'/%3E%3Ccircle cx='15' cy='45' r='5' fill='%23FF5A4E'/%3E%3Ccircle cx='29' cy='37' r='4.5' fill='%234FA3F7'/%3E%3Ccircle cx='43' cy='37' r='4.5' fill='%2334C77B'/%3E%3Ccircle cx='43' cy='21' r='4' fill='%23FFB020'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #111214; --surface: #1A1C1F; --surface2: #23262A; --surface3: #2D3035; --line: #2E3135;
  --ink: #ECE8E2; --dim: #A29C94; --faint: #6F6A64;
  --accent: #FFB020; --accent-ink: #2A1800; --accent-soft: rgba(255, 176, 32, .14); --accent-line: rgba(255, 176, 32, .45);
  --good: #34C77B; --bad: #FF5A4E; --stop: #E5484D;
  --r-root: #FF5A4E; --r-third: #4FA3F7; --r-fifth: #34C77B; --r-seventh: #B07CFF; --r-other: #8E96A3;
  --shadow: 0 20px 60px rgba(0, 0, 0, .45);
  --display: Archivo, "Inter", -apple-system, "Segoe UI", sans-serif;
  --sans: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F7F4EF; --surface: #FFFFFF; --surface2: #F0EBE3; --surface3: #E6E0D6; --line: #E2DCD2;
    --ink: #1C1A17; --dim: #6C655C; --faint: #A39C92;
    --accent: #A35F00; --accent-ink: #FFFFFF; --accent-soft: rgba(163, 95, 0, .10); --accent-line: rgba(163, 95, 0, .40);
    --shadow: 0 20px 60px rgba(40, 28, 10, .16);
  }
}
:root[data-theme="light"] {
  --bg: #F7F4EF; --surface: #FFFFFF; --surface2: #F0EBE3; --surface3: #E6E0D6; --line: #E2DCD2;
  --ink: #1C1A17; --dim: #6C655C; --faint: #A39C92;
  --accent: #A35F00; --accent-ink: #FFFFFF; --accent-soft: rgba(163, 95, 0, .10); --accent-line: rgba(163, 95, 0, .40);
  --shadow: 0 20px 60px rgba(40, 28, 10, .16);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--sans); font-size: 15.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
.narrow { max-width: 780px; }
.dim { color: var(--dim); }
.small { font-size: 13px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -.015em; margin: 0; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 18px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -.02em; white-space: nowrap; }
.brand svg { width: 30px; height: 30px; border-radius: 8px; flex: none; }
.tabs { display: flex; gap: 2px; flex: 1; justify-content: center; }
.tabs a { display: flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--dim); white-space: nowrap; }
.tabs a svg { width: 18px; height: 18px; }
.tabs a:hover { color: var(--ink); background: var(--surface2); }
.tabs a.on { color: var(--accent-ink); background: var(--accent); }
.tools { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.explore > *, .pgrid > *, .jgrid > *, .jam-now > * { min-width: 0; }
.icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; color: var(--dim); }
.icon:hover { background: var(--surface2); color: var(--ink); }
.icon svg { width: 20px; height: 20px; }
.jampill { white-space: nowrap; display: none; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; border: 1px solid var(--accent-line); }
.jampill.on { display: inline-flex; }
.jampill i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .jampill i { animation: none; } }

/* bottom nav on phones */
@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .top { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); }
  .top .wrap { height: 54px; }
  #jleg { flex: 1 1 100%; }
  #jampill-t { display: none; }
  .jampill { padding: 9px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); gap: 0; }
  .tabs a { flex-direction: column; gap: 2px; font-size: 11px; padding: 4px 6px; border-radius: 12px; min-width: 58px; }
  .tabs a svg { width: 22px; height: 22px; }
  .tabs a.on { background: none; color: var(--accent); }
  .tabs a.on svg { background: var(--accent-soft); border-radius: 999px; width: 44px; padding: 1px 11px; }
  body { padding-bottom: 76px; }
  .hide-m { display: none !important; }
}

main { padding: 26px 0 60px; min-height: 70vh; }

/* ---------- generic ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.card + .card { margin-top: 12px; }
.stack > * + * { margin-top: 14px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.label { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--dim); }
.kicker { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; color: var(--ink); }
.chip:hover { border-color: var(--accent-line); }
.chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; padding: 3px; background: var(--surface); gap: 2px; }
.seg button { padding: 6px 14px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--dim); white-space: nowrap; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 15px; background: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent-line); }
.btn.soft { background: var(--surface2); color: var(--ink); }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; }
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--surface3); border-radius: 999px; transition: .15s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); opacity: .75; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); background: var(--accent-ink); opacity: 1; }
.bar { height: 6px; border-radius: 6px; background: var(--surface3); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .3s; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; }
.tip { display: flex; gap: 12px; background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 16px; padding: 14px 16px; }
.tip svg { width: 20px; height: 20px; color: var(--accent); flex: none; margin-top: 2px; }
.rich p { margin: 0 0 10px; }
.rich b { color: var(--accent); font-weight: 700; }
.rich ul { margin: 0 0 10px; padding-left: 0; list-style: none; }
.rich li { padding-left: 20px; position: relative; margin: 4px 0; }
.rich li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.page-head { margin-bottom: 20px; }
.page-head h1 { font-size: clamp(30px, 4.4vw, 44px); line-height: 1.05; font-weight: 800; }
.page-head p { margin: 8px 0 0; color: var(--dim); max-width: 640px; }

/* ---------- fretboard ---------- */
.neck { overflow-x: auto; overflow-y: hidden; border-radius: 12px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
.neck svg { display: block; user-select: none; -webkit-user-select: none; touch-action: pan-x; }
.neck.tap svg { cursor: pointer; }
.neck text { font-family: var(--sans); pointer-events: none; }
.board-cap { font-weight: 700; font-size: 14px; margin-bottom: 8px; }

/* ---------- lessons ---------- */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; padding: 24px; background: linear-gradient(135deg, var(--surface), var(--surface2)); }
.hero h1 { font-size: clamp(30px, 4.6vw, 46px); font-weight: 800; line-height: 1.02; }
.hero .num { font-family: var(--display); font-size: 44px; font-weight: 800; color: var(--accent); line-height: 1; text-align: right; }
@media (max-width: 560px) { .hero { grid-template-columns: 1fr; } .hero .num { text-align: left; } }
.unit { margin-top: 30px; }
.unit h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-family: var(--sans); font-weight: 700; margin-bottom: 10px; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.lcard { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); transition: border-color .12s, transform .12s; }
.lcard:hover { border-color: var(--accent-line); transform: translateY(-1px); }
.lcard.next { background: var(--accent-soft); border-color: var(--accent-line); }
.lnum { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); font-weight: 700; font-size: 14px; flex: none; }
.lcard.done .lnum { background: var(--accent); color: var(--accent-ink); }
.lcard h3 { font-family: var(--sans); font-size: 16px; font-weight: 700; letter-spacing: 0; }
.lcard p { margin: 3px 0 0; color: var(--dim); font-size: 14px; }
.lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }
.lesson-nav a { color: var(--dim); font-weight: 600; font-size: 14px; max-width: 48%; }
.lesson-nav a:hover { color: var(--accent); }
.lesson-nav a span { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.donebadge { display: inline-flex; align-items: center; gap: 6px; color: var(--good); font-weight: 700; font-size: 14px; }

/* ---------- quiz ---------- */
.qtop { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.qtop .bar { flex: 1; }
.qcount { font-weight: 700; font-variant-numeric: tabular-nums; }
.qprompt { font-family: var(--display); font-size: clamp(22px, 3vw, 28px); font-weight: 700; line-height: 1.2; margin: 6px 0 18px; }
.answers { display: grid; gap: 8px; margin-top: 16px; }
.answers button { position: relative; min-height: 52px; padding: 10px 12px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line); font-weight: 600; font-size: 16px; text-align: center; }
.answers button:hover:not([disabled]) { border-color: var(--accent-line); background: var(--surface3); }
.answers button kbd { position: absolute; left: 9px; top: 7px; font: 600 10.5px var(--sans); color: var(--faint); }
.answers button.good { background: var(--good); border-color: var(--good); color: #fff; }
.answers button.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.answers button.good kbd, .answers button.bad kbd { color: rgba(255, 255, 255, .7); }
.answers button[disabled] { cursor: default; }
.feedback { margin-top: 18px; border-radius: 18px; padding: 18px; background: var(--surface); border: 1px solid var(--line); animation: rise .2s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.feedback .verdict { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; margin-bottom: 6px; }
.feedback .verdict svg { width: 22px; height: 22px; }
.feedback p { margin: 0 0 14px; white-space: pre-line; }
.hint { color: var(--faint); font-size: 12.5px; margin-top: 10px; }
.result { text-align: center; padding: 30px 0; }
.result .score { font-family: var(--display); font-size: 72px; font-weight: 800; line-height: 1; }
.result .pct { color: var(--accent); font-size: 22px; font-weight: 700; margin-top: 6px; }
.result p { max-width: 460px; margin: 16px auto 24px; color: var(--dim); }

/* ---------- practice ---------- */
.pgrid { display: grid; grid-template-columns: 330px 1fr; gap: 24px; align-items: start; }
@media (max-width: 900px) { .pgrid { grid-template-columns: 1fr; } }
.sticky { position: sticky; top: 80px; }
@media (max-width: 900px) { .sticky { position: static; } }
.kgroup { margin-bottom: 22px; }
.kgroup-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.kgroup-head h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-family: var(--sans); font-weight: 700; }
.kgroup-head button { color: var(--accent); font-weight: 600; font-size: 13.5px; }
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.kcard { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; }
.kcard:hover { border-color: var(--accent-line); }
.kcard h3 { font-family: var(--sans); font-size: 15px; font-weight: 700; letter-spacing: 0; }
.kcard p { margin: 2px 0 0; font-size: 13px; color: var(--dim); }
.kstat { text-align: right; flex: none; }
.kstat b { color: var(--accent); font-size: 16px; display: block; }
.kstat span { font-size: 11px; color: var(--faint); }
.mix { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); width: 100%; text-align: left; margin-bottom: 24px; }
.mix svg { width: 26px; height: 26px; flex: none; }
.mix h3 { font-family: var(--sans); font-size: 17px; letter-spacing: 0; }
.mix p { margin: 0; opacity: .8; font-size: 14px; }

/* ---------- chords / key ---------- */
.explore { display: grid; grid-template-columns: 300px 1fr; gap: 24px; align-items: start; }
@media (max-width: 900px) { .explore { grid-template-columns: 1fr; } }
.bigname { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.bigname h1 { font-size: clamp(44px, 7vw, 68px); font-weight: 800; line-height: 1; }
.tones { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
.tone { display: flex; flex-direction: column; align-items: center; min-width: 54px; padding: 8px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.tone b { font-size: 18px; }
.tone span { font-size: 12px; font-weight: 700; }
.scale-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 14px 0; }
.scale-row div { text-align: center; padding: 8px 0; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.scale-row b { display: block; font-size: 17px; }
.scale-row span { font-size: 12px; color: var(--dim); }
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; margin-top: 10px; }
.dchip { padding: 8px 4px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); text-align: center; }
.dchip span { display: block; font-size: 12px; font-weight: 700; color: var(--accent); }
.dchip b { font-size: 16px; }
.dchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dchip.on span { color: var(--accent-ink); }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.pitem { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; }
.pitem:hover { border-color: var(--accent-line); }
.pitem h3 { font-family: var(--sans); font-size: 13px; color: var(--dim); font-weight: 600; letter-spacing: 0; }
.pitem b { display: block; color: var(--accent); font-size: 16px; margin: 2px 0; }
.pitem span { font-size: 12.5px; color: var(--faint); }
.pitem svg { width: 22px; height: 22px; color: var(--accent); flex: none; }

/* ---------- jam ---------- */
.jam-now { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 22px; }
.jam-now .chord { font-family: var(--display); font-size: clamp(64px, 10vw, 104px); font-weight: 800; line-height: .95; letter-spacing: -.03em; }
.jam-now .next { text-align: right; }
.jam-now .next b { font-family: var(--display); font-size: 36px; font-weight: 800; display: block; line-height: 1; }
.beats { display: flex; gap: 7px; margin-top: 14px; align-items: center; min-height: 16px; }
.beats i { width: 11px; height: 11px; border-radius: 50%; background: var(--surface3); transition: transform .05s; }
.beats i.bar { background: var(--faint); }
.beats i.on { background: var(--accent); transform: scale(1.35); }
.beats i.on.count { background: var(--r-third); }
.chordstrip { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.chordstrip span { padding: 4px 10px; border-radius: 9px; background: var(--surface2); font-weight: 700; font-size: 14px; color: var(--dim); }
.chordstrip span.on { background: var(--accent); color: var(--accent-ink); }
.playbtn { min-width: 160px; font-size: 17px; padding: 15px 22px; }
.playbtn.stop { background: var(--stop); color: #fff; }
.jgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
@media (max-width: 900px) { .jgrid { grid-template-columns: 1fr; } }
input[type=range] { width: 100%; accent-color: var(--accent); }

/* ---------- dialog ---------- */
dialog { border: 1px solid var(--line); border-radius: 22px; background: var(--surface); color: var(--ink); padding: 0; width: min(460px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0, 0, 0, .5); }
dialog .dh { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 6px; }
dialog .dh h2 { font-size: 22px; }
dialog .db { padding: 6px 20px 20px; }
dialog .db > * + * { margin-top: 16px; }
.danger { color: var(--bad); font-weight: 600; font-size: 14px; }
footer { border-top: 1px solid var(--line); padding: 20px 0 30px; color: var(--faint); font-size: 13px; }
footer .wrap { display: flex; gap: 16px; justify-content: space-between; flex-wrap: wrap; }
footer a { color: var(--dim); }
footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<header class="top">
